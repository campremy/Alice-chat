// --- 効果音（Web Audio API） ---
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// BEEP音を鳴らす（周波数Hz、長さ秒）
function playBeep(freq, duration) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  gain.gain.value = 0.3;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + duration);
}

// 送信音: 440Hz, 0.08秒
function playSendSound() { playBeep(440, 0.08); }

// 返答音: 330Hz, 0.1秒
function playReplySound() { playBeep(330, 0.1); }

// 接続切れ音: 220Hz, 0.15秒 × 2回（間隔0.35秒）
function playDisconnectSound() {
  const ctx = getAudioCtx();
  for (let i = 0; i < 2; i++) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 220;
    gain.gain.value = 0.3;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const start = ctx.currentTime + i * 0.35;
    osc.start(start);
    osc.stop(start + 0.15);
  }
}

// --- カタカナ判定 ---
function isKatakanaMain(text) {
  // 空白・記号を除いた文字列
  const content = text.replace(/[\s\u3000!-/:-@\[-`{-~、。！？♪〜]/g, "");
  if (content.length === 0) return false;
  // 半角・全角のw/W/数字を統一して判定に使う正規表現
  const wChar = "wWｗＷ";
  const digitChar = "0-9０-９";
  const kana = "\u30A0-\u30FF";
  const allowed = new RegExp("^[" + kana + digitChar + wChar + "]+$");
  const digitOnly = new RegExp("^[" + digitChar + "]+$");
  const wOnly = new RegExp("^[" + wChar + "]+$");
  // 数字のみ（888、８８８等）
  if (digitOnly.test(content)) return true;
  // wのみ（www、ｗｗｗ等）
  if (wOnly.test(content)) return true;
  // カタカナと数字とwのみで構成
  if (allowed.test(content)) return true;
  // カタカナの割合が50%以上
  const katakanaCount = (content.match(/[\u30A0-\u30FF]/g) || []).length;
  return katakanaCount / content.length >= 0.5;
}

// 返答を選ぶ（カタカナ縛り判定付き）
function pickReply(text) {
  // カタカナ主体でなければカタカナ縛り返答
  if (!isKatakanaMain(text)) {
    return KATAKANA_ONLY_REPLIES[Math.floor(Math.random() * KATAKANA_ONLY_REPLIES.length)];
  }
  // カタカナ主体ならパターンマッチ（AND_PATTERNS優先）
  for (const pattern of AND_PATTERNS) {
    if (pattern.keywords.every(kw => text.includes(kw))) {
      return selectFromReplies(pattern.replies);
    }
  }
  for (const pattern of PATTERNS) {
    if (pattern.keywords.some(kw => text.includes(kw))) {
      return selectFromReplies(pattern.replies);
    }
  }
  return selectFromReplies(DEFAULT_REPLIES);
}

// 重み付き選択（同じセリフの連続回避）
let lastReply = "";
function selectFromReplies(replies) {
  // 重み付きアイテムを分離
  const weighted = [];
  const normal = [];
  for (const r of replies) {
    if (typeof r === "object") {
      weighted.push(r);
    } else {
      normal.push(r);
    }
  }
  // 重み付きアイテムの判定
  for (const w of weighted) {
    if (Math.random() < w.weight && w.text !== lastReply) {
      lastReply = w.text;
      return w.text;
    }
  }
  // 通常アイテムからランダム選択（連続回避）
  let candidate = normal[Math.floor(Math.random() * normal.length)];
  if (candidate === lastReply && normal.length > 1) {
    // 別のものを選び直す
    const others = normal.filter(r => r !== lastReply);
    candidate = others[Math.floor(Math.random() * others.length)];
  }
  lastReply = candidate;
  return candidate;
}

// --- タイマー ---
let remaining = 180;
let expired = false;
const timerEl = document.getElementById("timer-bar");

function updateTimer() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  timerEl.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// --- 自発発言（残り時間トリガー） ---
const autoMessages = {
  60: ["あ、もうすぐ時間だね", "もうすぐおわりか〜", "時間って早いね", "まだいてほしいな"],
  30: ["あと少しだね", "もうすこし", "いてくれてよかった", "さみしいな"],
  10: ["またね", "きてくれてありがとね", "ばいばい", "またいつか"],
};
const autoMessageFired = {};
let isProcessing = false;

// 自発発言を表示する
function fireAutoMessage(key) {
  autoMessageFired[key] = true;
  const msgs = autoMessages[key];
  const msg = msgs[Math.floor(Math.random() * msgs.length)];
  playReplySound();
  bubbleText.textContent = msg;
  addMessage("💭 " + msg, "alice");
}

const timerInterval = setInterval(() => {
  remaining--;
  if (remaining <= 0) {
    remaining = 0;
    clearInterval(timerInterval);
    expired = true;
    timerEl.classList.add("expired");
    document.getElementById("msg-input").disabled = true;
    document.getElementById("send-btn").disabled = true;
    addMessage("― 接続が切れました。 ―", "system");
    // 吹き出しフェードアウト
    const aliceBubble = document.getElementById("alice-bubble");
    aliceBubble.classList.add("fadeout");
    aliceBubble.addEventListener("transitionend", () => {
      aliceBubble.style.visibility = "hidden";
      aliceBubble.style.pointerEvents = "none";
    }, { once: true });
    // 接続切れ音
    playDisconnectSound();
    // ログダウンロードボタン表示
    document.getElementById("download-area").style.display = "block";
  }
  // 自発発言チェック（処理中なら1秒ずらして再試行）
  const triggers = [[60, 59], [30, 29], [10, 9]];
  for (const [primary, fallback] of triggers) {
    if (autoMessageFired[primary]) continue;
    if (remaining === primary) {
      if (!isProcessing) {
        fireAutoMessage(primary);
      }
      // isProcessing中はスキップ、fallbackで再試行
      break;
    }
    if (remaining === fallback) {
      if (!isProcessing) {
        fireAutoMessage(primary);
      }
      // fallbackでも処理中なら諦める
      break;
    }
  }
  updateTimer();
}, 1000);

// --- チャット ---
const chatLog = document.getElementById("chat-log");
const msgInput = document.getElementById("msg-input");
const sendBtn = document.getElementById("send-btn");
const bubbleText = document.getElementById("bubble-text");

// ログ記録用配列
const chatHistory = [];

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  // ログ記録
  const label = cls === "user" ? "[ユーザー]" : cls === "alice" ? "[アリス]" : "[システム]";
  chatHistory.push(label + " " + text);
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || expired) return;
  msgInput.value = "";

  // 処理中フラグをセット
  isProcessing = true;

  // ユーザーメッセージ追加
  playSendSound();
  addMessage(text, "user");

  // 1〜2秒後にアリスが返答
  const delay = 1000 + Math.random() * 1000;
  setTimeout(() => {
    if (expired) { isProcessing = false; return; }
    const reply = pickReply(text);
    playReplySound();
    bubbleText.textContent = reply;
    addMessage(reply, "alice");
    isProcessing = false;
  }, delay);
}

sendBtn.addEventListener("click", sendMessage);
msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

  addMessage("💰 スパチャを送りました！", "system");
  if (expired) {

    playReplySound();
    const staffMsg = "ありがとうございます。\n確かにアリスにお渡しいたします。\n\u3000\u3000\u3000\u3000\u3000\u3000運営より";
    const div = document.createElement("div");
    div.className = "msg staff";
    div.textContent = staffMsg;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    chatHistory.push("[運営] " + staffMsg.replace(/\n/g, " "));
  } else {
    // タイマー中：アリスが返答
    setTimeout(() => {
      playReplySound();
      const reply = "ありがとう！";
      bubbleText.textContent = reply;
      addMessage(reply, "alice");
    }, 3000);

});

// --- ログダウンロード ---
document.getElementById("download-btn").addEventListener("click", () => {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const dateStr = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
    + "_" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
  const dateDisplay = now.getFullYear() + "/" + pad(now.getMonth() + 1) + "/" + pad(now.getDate())
    + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());

  let content = "---\n";
  content += "アリス LIVE ログ\n";
  content += dateDisplay + "\n";
  content += "---\n";
  content += chatHistory.join("\n") + "\n";
  content += "---\n";

  const blob = new Blob([content], { type: "text/plain; charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "alice_log_" + dateStr + ".txt";
  a.click();
  URL.revokeObjectURL(url);
});
